<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weathervane — outdoor safety advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="spine-tab" aria-hidden="true">field&nbsp;log — weathervane</div>

  <div id="app">
    <header class="site-header">
      <div class="brand">
        <svg class="brand-mark" width="36" height="36" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <circle cx="17" cy="17" r="15.3" stroke="currentColor" stroke-width="1.2" class="ring"/>
          <g class="ticks" stroke="currentColor" stroke-width="1" stroke-linecap="round">
            <line x1="17" y1="2.6" x2="17" y2="5.4"/>
            <line x1="17" y1="28.6" x2="17" y2="31.4"/>
            <line x1="2.6" y1="17" x2="5.4" y2="17"/>
            <line x1="28.6" y1="17" x2="31.4" y2="17"/>
          </g>
          <circle class="north" cx="17" cy="1.6" r="1.4" />
          <g id="needle" class="needle tier-clear">
            <path d="M17 6.5L20 17L17 15.4L14 17L17 6.5Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"/>
            <path d="M17 27.5L14.6 19.5L17 20.7L19.4 19.5L17 27.5Z" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linejoin="round" opacity="0.55"/>
          </g>
          <circle cx="17" cy="17" r="1.6" fill="currentColor" class="hub"/>
        </svg>
        <div class="brand-text">
          <h1>Weathervane</h1>
          <p>tells you straight whether it's safe to be outside</p>
        </div>
      </div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span class="status-label">watching the sky</span>
      </div>
    </header>

    <main id="scrollback" aria-live="polite"></main>

    <div class="chips" id="chips" aria-label="example questions">
      <span class="chips-label">try —</span>
      <button type="button" class="chip" data-fill="cycling in Denver">cycling in Denver</button>
      <button type="button" class="chip" data-fill="a picnic in Seattle">a picnic in Seattle</button>
      <button type="button" class="chip" data-fill="running in Phoenix">running in Phoenix</button>
      <button type="button" class="chip" data-fill="hiking in Boulder">hiking in Boulder</button>
    </div>

    <form id="composer" autocomplete="off">
      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="is it safe to cycle in Denver today?"
        autofocus
        maxlength="500"
      />
      <button id="send" type="submit" aria-label="send">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">
          <path d="M2 8.5L15 2L10.5 15L8 9.5L2 8.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <p class="hint">enter to send &nbsp;·&nbsp; <kbd>/</kbd> to focus &nbsp;·&nbsp; advisories are generated from current conditions and local rules, not a guarantee</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
