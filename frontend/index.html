<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>weather advisory bot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <span class="prompt">$</span> weather-advisory-bot
    </header>
    <div id="scrollback"></div>
    <form id="composer">
      <span class="prompt">&gt;</span>
      <input id="input" type="text" autocomplete="off" placeholder="is it safe to cycle in Denver today?" autofocus />
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
